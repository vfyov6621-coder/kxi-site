# kxi backend — api.kxi.kixprojects.online
# Установка:
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/kxi-api.conf
#   sudo ln -s /etc/nginx/sites-available/kxi-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (добавит 443-блок и редирект сам):
#   sudo certbot --nginx -d api.kxi.kixprojects.online

server {
    listen 80;
    listen [::]:80;
    server_name api.kxi.kixprojects.online;

    location / {
        # нода/API kxi слушает локально (см. deploy/kxi-api.service)
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # HTTP + WebSocket (live-поток проб майнинга: /ws/probe)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
